# Test on every push; publish to the Chrome Web Store on a v* tag.
#
# The `workflow:` block below is the one shared across selan-auth, selan-admin,
# selan-cli, selan-control, selan-proxy and selan-website. Change it here and
# change it in all of them.
#
# What this repository adds over the others is `verify`. extension/ holds build
# output that is committed on purpose — "Load unpacked" has to work from a
# clone, and the reproducibility check needs something to compare against — so
# the one failure mode unique to this repo is source and artefact drifting
# apart. `npm run check` rebuilds and fails on a single byte of difference,
# which is why it must run on a tag as well as on a branch: publishing a bundle
# that does not match the published source would break the only claim the
# README makes.

stages: [test, release]

# One pipeline per push, not two. `review` runs on a merge request event, and asking
# for those makes GitLab willing to create a merge-request pipeline *alongside* the
# branch pipeline it already created — so every other job would run twice on a push to
# a branch with an open merge request, on a machine with three slots. The third rule
# drops the branch pipeline once a merge request exists to carry it.
#
# The tag rule is not decoration. Without it this block would refuse to create a
# pipeline for a tag at all, and releases here are tag-triggered
# ($CI_COMMIT_TAG =~ /^v/) — the same block that is harmless in six repositories
# would silently stop the seventh from ever shipping a release.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

# Not optional: the group can reach GitLab's hosted runners, so an untagged job is
# eligible for those too and would bill compute minutes instead of running for free
# on the Mac mini. A forgotten tag should fail loudly rather than cost money
# quietly.
default:
  tags: [macmini]

test:
  stage: test
  image: node:22
  script:
    # The same command CLAUDE.md tells a contributor to run, in one piece, so
    # CI and the instruction cannot drift: typecheck, lint, tests, and the
    # rebuild-and-compare that guards extension/.
    - npm ci
    - npm run check

# Builds the artefact a human can inspect before anything is published, and
# keeps it whether or not the publish step runs. A tag that fails to reach the
# Web Store should still leave a zip someone can upload by hand.
package:
  stage: release
  image: node:22
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    - npm ci
    - npm run check
    - cd extension && zip -r -X "../claude-ai-export-${CI_COMMIT_TAG}.zip" . && cd ..
    - unzip -l "claude-ai-export-${CI_COMMIT_TAG}.zip"
  artifacts:
    paths:
      - claude-ai-export-*.zip
    expire_in: 1 year

# Uploads and publishes. Needs four masked, protected CI/CD variables, all of
# which come from a one-time manual setup described in docs/PUBLISHING.md:
#
#   CWS_EXTENSION_ID     the id the Web Store assigned on first manual upload
#   CWS_CLIENT_ID        Google OAuth client, Chrome Web Store API enabled
#   CWS_CLIENT_SECRET
#   CWS_REFRESH_TOKEN    minted once against that client
#
# Manual, not automatic: a Web Store submission enters review and cannot be
# recalled once it goes live, so the tag says "this is releasable" and a person
# says "release it".
publish:
  stage: release
  image: node:22
  needs: [package]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
      when: manual
  script:
    - node scripts/publish.mjs "claude-ai-export-${CI_COMMIT_TAG}.zip"
